name: Generate Movie Share Pages and Sitemap
on:
  push:
    branches: [main]
    paths:
      - 'movies.json'
      - 'scripts/generate_movie_pages.py'
      - '.github/workflows/generate-movie-share-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: movie-share-pages
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate movie pages and sitemap
        run: python scripts/generate_movie_pages.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movie sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Auto-generate movie share pages and sitemap"
            git push
          fi
          
